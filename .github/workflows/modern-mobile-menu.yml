name: Modern mobile dropdown menus
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-menus:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation
        shell: python
        run: |
          from pathlib import Path
          files = ['WebDev-L1-LandingPage/index.html','webDev-L1-Portfolio/index.html','WebDev-L1-TemperatureConverter/index.html']
          for name in files:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if 'MODERN MOBILE DROPDOWN MENU' in s: continue
              if 'LandingPage' in name:
                  css='''<style>/* MODERN MOBILE DROPDOWN MENU */ .mobile-menu-btn{display:none;width:44px;height:44px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.08);color:inherit;align-items:center;justify-content:center;cursor:pointer}.mobile-menu-btn span{width:18px;height:2px;background:currentColor;box-shadow:0 -6px currentColor,0 6px currentColor}.navbar.menu-open .mobile-menu-btn span{box-shadow:none;transform:rotate(45deg)}.navbar.menu-open .mobile-menu-btn span:after{content:'';display:block;width:18px;height:2px;background:currentColor;transform:rotate(90deg)}@media(max-width:760px){.navbar{position:sticky;top:0;z-index:100;flex-wrap:nowrap}.mobile-menu-btn{display:flex;margin-left:auto}.navbar nav{position:absolute;top:calc(100% + 8px);left:10px;right:10px;width:auto!important;display:flex!important;flex-direction:column;gap:4px!important;padding:10px!important;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(17,10,31,.97);box-shadow:0 20px 45px rgba(0,0,0,.35);backdrop-filter:blur(20px);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.22s}.navbar.menu-open nav{opacity:1;visibility:visible;transform:translateY(0)}.navbar nav a{width:100%;padding:13px 14px!important;border-radius:12px;font-size:.88rem!important;white-space:normal!important}.navbar nav a:hover{background:rgba(255,255,255,.08)}} </style>'''
                  s=s.replace('</head>',css+'\n</head>')
                  s=s.replace('<nav>','<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu" aria-expanded="false"><span></span></button><nav>',1)
                  js='''<script>const b=document.getElementById('mobileMenuBtn'),n=document.querySelector('.navbar');b&&b.addEventListener('click',()=>{const o=n.classList.toggle('menu-open');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu')});n.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>n.classList.remove('menu-open')));</script>'''
              elif 'Portfolio' in name:
                  css='''<style>/* MODERN MOBILE DROPDOWN MENU */ .mobile-menu-btn{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:rgba(245,160,40,.1);color:var(--amber-1);align-items:center;justify-content:center;cursor:pointer}.mobile-menu-btn span{width:18px;height:2px;background:currentColor;box-shadow:0 -6px currentColor,0 6px currentColor}.menu-open .mobile-menu-btn span{box-shadow:none;transform:rotate(45deg)}.menu-open .mobile-menu-btn span:after{content:'';display:block;width:18px;height:2px;background:currentColor;transform:rotate(90deg)}@media(max-width:880px){nav.wrap{position:relative}.mobile-menu-btn{display:flex;margin-left:8px}.nav-links{position:absolute;top:calc(100% + 8px);left:18px;right:18px;width:auto!important;display:flex!important;flex-direction:column;gap:4px!important;padding:10px!important;border:1px solid var(--line);border-radius:18px;background:rgba(18,12,9,.98);box-shadow:0 20px 45px rgba(0,0,0,.4);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.22s}.menu-open .nav-links{opacity:1;visibility:visible;transform:translateY(0)}.nav-links a{width:100%;padding:12px 14px;border-radius:12px;font-size:.86rem;border:0}.nav-links a:hover{background:rgba(255,255,255,.06)}} </style>'''
                  s=s.replace('</style>',css+'\n</style>',1)
                  s=s.replace('<div class="nav-links">','<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu" aria-expanded="false"><span></span></button><div class="nav-links">',1)
                  js='''<script>const b=document.getElementById('mobileMenuBtn'),h=document.querySelector('header');b&&b.addEventListener('click',()=>{const o=h.classList.toggle('menu-open');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu')});h.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>h.classList.remove('menu-open')));</script>'''
              else:
                  css='''<style>/* MODERN MOBILE DROPDOWN MENU */ .menu-shell{position:fixed;top:0;right:0;z-index:40;padding:10px 14px}.mobile-menu-btn{width:44px;height:44px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.09);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.mobile-menu-btn span{width:18px;height:2px;background:currentColor;box-shadow:0 -6px currentColor,0 6px currentColor}.project-nav.menu-open+.menu-shell .mobile-menu-btn span{box-shadow:none;transform:rotate(45deg)}@media(max-width:600px){.project-nav{position:fixed;top:62px;left:12px;right:12px;display:flex;flex-direction:column;gap:4px;padding:10px;overflow:visible;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(18,10,30,.97);box-shadow:0 20px 45px rgba(0,0,0,.38);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.22s}.project-nav.menu-open{opacity:1;visibility:visible;transform:translateY(0)}.project-nav a{width:100%;padding:12px 14px;font-size:12px;text-align:left;border:0;border-radius:12px}.project-nav a:hover{background:rgba(255,255,255,.08)}} </style>'''
                  s=s.replace('</style>',css+'\n</style>',1)
                  s=s.replace('</body>','<div class="menu-shell"><button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu" aria-expanded="false"><span></span></button></div><script>const b=document.getElementById("mobileMenuBtn"),n=document.querySelector(".project-nav");b&&b.addEventListener("click",()=>{const o=n.classList.toggle("menu-open");b.setAttribute("aria-expanded",o);b.setAttribute("aria-label",o?"Close menu":"Open menu")});n.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>n.classList.remove("menu-open")));</script></body>',1)
                  p.write_text(s,encoding='utf-8'); continue
              s=s.replace('</body>',js+'\n</body>',1); p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add WebDev-L1-LandingPage/index.html webDev-L1-Portfolio/index.html WebDev-L1-TemperatureConverter/index.html
          git commit -m "feat: add modern mobile dropdown menus"
          git push
          git rm .github/workflows/modern-mobile-menu.yml
          git commit -m "chore: remove one-time menu workflow"
          git push
