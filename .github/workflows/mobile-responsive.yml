name: Make OIBSIP pages mobile responsive
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-responsive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile responsive styles
        shell: python
        run: |
          from pathlib import Path

          portfolio = Path('webDev-L1-Portfolio/index.html')
          text = portfolio.read_text(encoding='utf-8')
          css = '''\n  /* ---------- MOBILE RESPONSIVE PROJECT NAV ---------- */\n  @media (max-width: 880px){\n    header{position:sticky;}\n    nav.wrap{height:auto; min-height:68px; padding:12px 18px; gap:12px;}\n    .brand{font-size:1rem;}\n    .nav-links{display:flex; width:100%; order:3; gap:8px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; white-space:nowrap;}\n    .nav-links::-webkit-scrollbar{display:none;}\n    .nav-links a{font-size:.78rem; padding:7px 10px; border:1px solid var(--line); border-radius:999px; flex:0 0 auto;}\n    .nav-cta{font-size:.78rem; padding:8px 14px; margin-left:auto;}\n    .nav-toggle{display:none;}\n    .hero{padding:54px 0 48px;}\n    .hero .wrap{gap:34px;}\n    .hero h1{font-size:clamp(2rem,10vw,3rem);}\n    .hero .role{font-size:1rem;}\n    .hero p.lede{font-size:.9rem;}\n    .btn-row,.center-cta{width:100%;}\n    .btn{justify-content:center; width:100%;}\n    .stats{justify-content:space-between; gap:16px;}\n    .social-row{justify-content:center;}\n    .section{padding:60px 0;}\n    .section-head h2{font-size:1.75rem;}\n    .contact-card{padding:24px;}\n    .contact-links a{font-size:.86rem; overflow-wrap:anywhere;}\n    footer .wrap{justify-content:center; text-align:center;}\n  }\n\n  @media (max-width:480px){\n    .wrap{padding:0 18px;}\n    nav.wrap{padding:10px 14px;}\n    .nav-links{gap:6px;}\n    .hero-photo-wrap{max-width:240px;}\n    .stats{gap:12px;}\n    .stat b{font-size:1.35rem;}\n    .stat span{font-size:.72rem;}\n    .grid-3,.projects-grid{gap:16px;}\n    .card{padding:22px 18px;}\n    .contact-card{padding:22px 18px;}\n  }\n'''
          marker = '\n</style>'
          if 'MOBILE RESPONSIVE PROJECT NAV' not in text:
              text = text.replace(marker, css + marker, 1)
              portfolio.write_text(text, encoding='utf-8')

          temp = Path('WebDev-L1-TemperatureConverter/index.html')
          text = temp.read_text(encoding='utf-8')
          css = '''\n    /* ---------- MOBILE RESPONSIVE ---------- */\n    @media (max-width: 600px){\n      .project-nav{justify-content:flex-start; overflow-x:auto; flex-wrap:nowrap; gap:7px; padding:10px 12px; scrollbar-width:none;}\n      .project-nav::-webkit-scrollbar{display:none;}\n      .project-nav a{font-size:11px; padding:7px 10px; flex:0 0 auto; white-space:nowrap;}\n      .app{padding:78px 14px 20px;}\n      .converter{width:100%; max-width:100%; padding:26px 18px;}\n      .converter h1{font-size:clamp(2.1rem,11vw,3.2rem); line-height:1.05;}\n      .converter .intro{font-size:.9rem;}\n      form{width:100%;}\n      input,select,button{width:100%; min-height:48px;}\n      .result{margin-top:20px;}\n      #resultValue{font-size:clamp(2rem,12vw,3.5rem); overflow-wrap:anywhere;}\n      footer{text-align:center; font-size:.75rem; padding:18px 8px;}\n    }\n    @media (max-width:380px){\n      .app{padding-left:10px; padding-right:10px;}\n      .converter{padding:22px 14px;}\n      .brand{font-size:.85rem;}\n    }\n'''
          marker = '\n  </style>'
          if 'MOBILE RESPONSIVE' not in text:
              text = text.replace(marker, css + marker, 1)
              temp.write_text(text, encoding='utf-8')

          landing = Path('WebDev-L1-LandingPage/index.html')
          # Add a small viewport-safe navigation override without changing its content.
          text = landing.read_text(encoding='utf-8')
          css = '''\n  /* ---------- MOBILE RESPONSIVE NAVIGATION ---------- */\n  @media (max-width: 760px){\n    .navbar{flex-wrap:wrap; gap:10px; padding:12px 16px;}\n    .navbar nav{width:100%; display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}\n    .navbar nav::-webkit-scrollbar{display:none;}\n    .navbar nav a{flex:0 0 auto; white-space:nowrap; font-size:.78rem;}\n    .hero{grid-template-columns:1fr;}\n    .hero-content{width:100%;}\n    .hero-actions{flex-direction:column; align-items:stretch;}\n    .hero-actions .btn{width:100%; text-align:center;}\n    .hero-card{min-height:280px;}\n    .feature-grid{grid-template-columns:1fr;}\n    .about{grid-template-columns:1fr;}\n    .section,.cta{padding-left:18px; padding-right:18px;}\n  }\n  @media (max-width:480px){\n    .navbar .logo{font-size:1rem;}\n    .hero h1{font-size:clamp(2.2rem,11vw,3.5rem);}\n    .hero-card{min-height:230px;}\n    .mini-card{font-size:.75rem;}\n  }\n'''
          marker = '\n</style>'
          # Landing page stylesheet is external, so place a responsive link-safe block in the HTML head.
          if 'MOBILE RESPONSIVE NAVIGATION' not in text:
              text = text.replace('</head>', '<style>' + css + '</style>\n</head>', 1)
              landing.write_text(text, encoding='utf-8')
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webDev-L1-Portfolio/index.html WebDev-L1-TemperatureConverter/index.html WebDev-L1-LandingPage/index.html .github/workflows/mobile-responsive.yml
          git commit -m "feat: improve mobile responsiveness across OIBSIP pages"
          git rm .github/workflows/mobile-responsive.yml
          git commit -m "chore: remove one-time mobile responsive workflow"
          git push