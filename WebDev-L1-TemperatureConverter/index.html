<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Purple temperature converter using vanilla JavaScript.">
  <title>Tempora | Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="converter">
      <div class="brand"><span>°</span> TEMPORA</div>
      <p class="eyebrow">OIBSIP • WEB DEVELOPMENT • TASK 3</p>
      <h1>Temperature<br><span>Converter</span></h1>
      <p class="intro">Convert temperatures instantly between Celsius, Fahrenheit and Kelvin.</p>

      <form id="converterForm" novalidate>
        <label for="temperature">Temperature</label>
        <div class="input-wrap">
          <input id="temperature" type="number" step="any" placeholder="e.g. 25" autocomplete="off">
          <span class="unit-mark">°</span>
        </div>

        <label for="fromUnit">Convert from</label>
        <select id="fromUnit">
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>

        <label for="toUnit">Convert to</label>
        <select id="toUnit">
          <option value="F">Fahrenheit (°F)</option>
          <option value="C">Celsius (°C)</option>
          <option value="K">Kelvin (K)</option>
        </select>

        <button type="submit">Convert Temperature <span>→</span></button>
      </form>

      <div id="message" class="message" role="alert"></div>

      <div id="result" class="result" aria-live="polite">
        <div class="result-label">RESULT</div>
        <div id="resultValue">—</div>
        <div id="resultUnit">Enter a value to begin</div>
      </div>

      <p class="hint">Absolute zero is −273.15°C / −459.67°F / 0K.</p>
    </section>

    <footer>Built with HTML5, CSS3 &amp; Vanilla JavaScript • 2026</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
